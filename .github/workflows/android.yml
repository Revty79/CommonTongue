name: Android foundation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0 # Accepted-source guard compares the immutable Pass 6 baseline.
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle and validate wrapper
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - name: Install stable Android SDK components
        run: |
          if [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/android" ]; then
            "$ANDROID_HOME/cmdline-tools/latest/bin/android" --no-metrics --sdk="$ANDROID_HOME" sdk install platforms/android-36 build-tools/36.0.0
          else
            sdkmanager_path=""
            for candidate in \
              "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
              "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager \
              "$ANDROID_HOME/tools/bin/sdkmanager"; do
              if [ -x "$candidate" ]; then
                sdkmanager_path="$candidate"
                break
              fi
            done
            if [ -z "$sdkmanager_path" ]; then
              sdkmanager_path="$(command -v sdkmanager || true)"
            fi
            if [ -z "$sdkmanager_path" ] || [ ! -x "$sdkmanager_path" ]; then
              echo "::error::sdkmanager not found beneath ANDROID_HOME or on PATH"
              exit 1
            fi
            "$sdkmanager_path" --sdk_root="$ANDROID_HOME" "platforms;android-36" "build-tools;36.0.0"
          fi
      - name: Prepare locked production native runtime without models
        run: |
          sdkmanager_path="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$sdkmanager_path" ]; then
            sdkmanager_path="$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -type f | head -n 1)"
          fi
          test -x "$sdkmanager_path"
          "$sdkmanager_path" --sdk_root="$ANDROID_HOME" "ndk;27.1.12297006" "cmake;3.22.1"
          rustup toolchain install 1.91.0 --profile minimal
          rustup target add aarch64-linux-android --toolchain 1.91.0
          python3 tools/local-ai/prepare.py
          bash tools/local-ai/build-native.sh
          python3 tools/local-ai/verify-boundaries.py
      - name: Compile, test, lint, and verify foundation boundaries
        run: ./gradlew --no-daemon --console=plain --warning-mode=all clean test lint spotlessCheck verifyCoreBoundaries :app:verifyFoundationManifest assembleDebug :app:assembleDebugAndroidTest :app:assembleRelease
      - name: Check research harness without models
        run: python3 -m unittest discover -s tools/offline-feasibility/tests -v
      - name: Check translation benchmark without models
        run: python3 -m unittest discover -s tools/translation-quality/tests -v
      - name: Check physical trial tooling without devices or models
        run: python3 -m unittest discover -s tools/device-trial/tests -v
      - name: Verify accepted research baseline and package Pass 7 adapter check
        run: |
          python3 tools/voice-layer/verify-baseline.py
          python3 tools/local-ai/package.py
      - name: Upload Pass 7 adapter check and validation reports
        uses: actions/upload-artifact@v7
        with:
          name: CommonTongue-Pass7-Adapter-Check-${{ github.sha }}
          path: |
            .local/pass7-artifacts/*
            platform/local-ai/build/reports/tests/
            platform/android-local-ai/build/reports/tests/
            platform/android-speech/build/reports/tests/
            platform/android-speech/build/reports/lint-results-debug.html
          retention-days: 30
          if-no-files-found: error
      # Instrumentation remains local/manual in Pass 1; see README.md.
