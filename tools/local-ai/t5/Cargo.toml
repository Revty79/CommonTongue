[package]
name = "common-tongue-device-t5"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "trial_t5"
path = "src/production.rs"
crate-type = ["cdylib"]

[dependencies]
anyhow = "1"
serde_json = "1"
tokenizers = { version = "=0.22.2", default-features = false, features = ["onig"] }
candle = { package = "candle-core", path = "../../../.local/local-ai/sources/candle/candle-core" }
candle-transformers = { path = "../../../.local/local-ai/sources/candle/candle-transformers" }

[profile.release]
lto = "thin"
codegen-units = 1

